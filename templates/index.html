<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khmer Audio &rarr; English</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f0f0f0;
      --muted: #999;
      --border: #333;
      --accent: #4f8dfd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  input[type="file"] {
    display: block;
    width: 100%;
    margin-bottom: 1rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .result-block {
    margin-top: 1rem;
  }
  .result-block h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .result-text {
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .status {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .error {
    color: #dc2626;
    font-size: 0.9rem;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Khmer Audio &rarr; English Transcript</h1>
  <p class="subtitle">Upload an audio file spoken in Khmer. It will be transcribed and translated to English.</p>

  <div class="card">
    <form id="upload-form">
      <input type="file" id="audio-input" name="audio" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.webm" required>
      <button type="submit" id="submit-btn">Transcribe</button>
    </form>
    <p id="status" class="status hidden"></p>
    <p id="error" class="error hidden"></p>
  </div>

  <div class="card hidden" id="result-card">
    <div class="result-block">
      <h2>Khmer transcript</h2>
      <div class="result-text" id="khmer-text"></div>
    </div>
    <div class="result-block">
      <h2>English translation</h2>
      <div class="result-text" id="english-text"></div>
    </div>
    <div class="result-block">
      <h2>Token usage</h2>
      <div class="result-text" id="token-usage"></div>
    </div>
  </div>
</main>

<script>
const form = document.getElementById('upload-form');
const submitBtn = document.getElementById('submit-btn');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultCard = document.getElementById('result-card');
const khmerText = document.getElementById('khmer-text');
const englishText = document.getElementById('english-text');
const tokenUsage = document.getElementById('token-usage');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('audio-input');
  if (!fileInput.files.length) return;

  const formData = new FormData();
  formData.append('audio', fileInput.files[0]);

  submitBtn.disabled = true;
  errorEl.classList.add('hidden');
  resultCard.classList.add('hidden');
  statusEl.textContent = 'Uploading and transcribing... this can take a moment for longer files.';
  statusEl.classList.remove('hidden');

  try {
    const res = await fetch('/api/transcribe', { method: 'POST', body: formData });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }

    khmerText.textContent = data.khmer || '(no Khmer transcript returned)';
    englishText.textContent = data.english || '(no English translation returned)';

    if (data.token_usage) {
      const u = data.token_usage;
      tokenUsage.textContent =
        `input (audio+prompt): ${u.prompt_tokens}\n` +
        `thinking: ${u.thoughts_tokens ?? 0}\n` +
        `output: ${u.output_tokens}\n` +
        `total: ${u.total_tokens}`;
    } else {
      tokenUsage.textContent = '(not available)';
    }

    resultCard.classList.remove('hidden');

    if (data.truncated) {
      statusEl.textContent = 'Warning: the response hit the output length limit and may be cut off before the end of the audio.';
      statusEl.classList.remove('hidden');
    } else {
      statusEl.classList.add('hidden');
    }
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
    statusEl.classList.add('hidden');
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
